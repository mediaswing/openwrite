# ---------------------------------------------------------- the empty screenplay
#
# What a new screenplay starts as: a page of working markup rather than an empty
# box. INT., the capitals, the colon form and /transition: are markup the parser
# reads — keep them exactly as they are, and translate the prose around them.

welcome.screenplay = "Title: Untitled\nAuthor:\n\n"
                     "INT. SOMEWHERE - DAY\n\n"
                     "Type here. A line beginning with INT. or EXT. starts a scene.\n\n"
                     "A CHARACTER\n(quietly)\n"
                     "Put a name in capitals above a line to make it dialogue.\n\n"
                     "SOMEBODY ELSE: Or write the name, a colon, and the line, all in one go.\n\n"
                     "/transition:cut to\n"
