# ------------------------------------------------------------- the audio drama
#
# The tab that reads a story file aloud with ElevenLabs voices and mixes the
# result. A few of the words here are worth knowing before you translate them:
#
#   state      how a line is spoken — the `state="scared"` in the story file.
#              These are the names of ways of speaking, not of moods, so
#              choose the word your language would put in a stage direction.
#   semitone   the musical step. {semitones} arrives already signed, as "+4.0",
#              so do not add a plus or a minus of your own.
#   voice id   ElevenLabs' own identifier for a voice. Not translated: it is a
#              code that gets pasted, like a serial number.

