# Screenplay Creation Tool language file — English
#
# This is the reference file. Every other language is checked against it by a
# test: same keys, same {placeholders}. To start a new language, copy this file,
# change `code`, `name` and `plural` at the top, and translate the right-hand
# side of each line. Leave the keys alone.
#
# Drop your file into the `languages` folder — the language window has a button
# that opens it — and it appears in the picker. Nothing needs rebuilding.
#
# A few things worth knowing before you start:
#
#   {C}          becomes ⌘ on a Mac and Ctrl+ on Windows. Put it wherever the
#                sentence needs it; you never have to write ⌘ yourself.
#   {name}       and the other braced words are values the program fills in. You
#                may move them anywhere in the sentence, but do not rename them.
#   .one/.other  a counted message. Give every form your language uses — see
#                `plural` below.
#   "…" "…"      a long value continued on the next line. The two are joined
#                exactly as written, so mind the space at the end of the first.
#
# You do not have to finish. Any line you have not translated falls back to the
# English one here, so the editor stays usable from your very first line.
#
# One thing is not translatable, and it is deliberate: Fountain markup. INT.,
# EXT., the colon in MAYA: Forty-one. and /transition: are what the parser
# reads, and they stay as they are in every language. Where they appear below
# they are marked.

code   = "en"
name   = "English"

# Which plural rule this language follows. One of:
#   one_other   one form for 1, another for everything else (English, German,
#               Spanish, Italian, Dutch, Swedish)
#   french      as above, but 0 also takes the singular (French, pt-BR)
#   polish      one / few / many
#   russian     one / few / many, counted differently (Russian, Ukrainian)
plural = "one_other"


